name: Buduj program PGE_MAKER.exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zależności
        run: python -m pip install --upgrade pip pyinstaller pillow python-docx openpyxl ezdxf

      - name: Budowa exe
        run: >
          pyinstaller --onefile --windowed --name PGE_MAKER
          --add-data "przewieszenia baza.dxf;."
          --add-data "arkusze.dxf;."
          --add-data "szablon.dxf;."
          --add-data "orientacja.png;."
          --add-data "szablon_opisu.docx;."
          --add-data "PPW miński szablon.docx;."
          --add-data "wzorce;wzorce"
          --hidden-import PIL._tkinter_finder
          --hidden-import docx
          --hidden-import openpyxl
          --hidden-import ezdxf
          --collect-submodules ezdxf
          generator_gui.py

      - name: Publikacja (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" dist/PGE_MAKER.exe \
            --target "${{ github.sha }}" --latest \
            --title "PGE_MAKER $TAG" \
            --notes "Program PGE_MAKER.exe - uruchom dwuklikiem, wskaż plik planu DXF, zaznacz co wygenerować (numeracja / przewieszenia / zestawienie / obliczenia / rysunki stałe / PZT / opisy / PPW) i wybierz katalog zapisu."
